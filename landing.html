<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Форма заявки на курс</title>
    </head>
    <body>
    <section id="contact">
<h2>Форма заявки на курс</h2>
        <form action="form" method="post">
            <div>
                <input type="text" id="name" name="name" required minlength="2" maxlength="50">
                <label for="name">Введіть імʼя</label>
                
            </div>
            <div>
                <input type="tel" id="tel" name="tel" required placeholder="+380XXXXXXXXX" pattern="^(\+38)?0\d{9}$" autocomplete="tel">
                <label for="tel">Введіть номер телефону</label>
                
                
            </div>
            
            <div>
                <input type="email" id="email" name="email" required autocomplete="email">
                <label for="email">Ведіть адресу електронної пошти</label>
                
                
            </div>
            <label for="choose-course">Оберіть курс</label>
            <select id="choose-course" name="course">
                <optgroup label="Course">
                    
                    <option value="Java">Java</option>
                    <option value="C++">C++</option>
                    <option value="CSS">CSS</option>
                </optgroup>
                
                
                
                
            </select>
            <fieldset>
                <legend>Рівень підготовки</legend>
                <div>
                    <input type="radio" id="beginner" name="level" value="beginner" checked>
                    <label for="beginner">Початківець</label>
                    
                    
                </div>
                <div>
                    <input type="radio" id="middle" name="level" value="middle">
                    <label for="middle">Середній</label>
                    
                    
                </div>
                <div>
                    <input type="radio" id="advanced" name="level" value="advanced">
                    <label for="advanced">Профі</label>
                    
                    
                </div>
                <fieldset>
                    
                    <legend>Зручний час для дзвінка</legend>
                    <div>
                        <input type="checkbox" id="morning" name="time" value="morning">
                        <label for="morning">Ранок (09:00 - 12:00)</label>
                    </div>
                    
                    <div>

                        
                        <input type="checkbox" id="afternoon" name="time" value="afternoon">
                        <label for="afternoon">День (12:00 - 18:00)</label>
                    </div>
                    
                    
                </fieldset>


                <div>

<label for="message">Повідомлення</label>
<textarea id="message"  name="message" rows="4"></textarea>


                </div>



                <div>
                    <label for="agree">Я згоден з  <a href="#" > політикою використання</a> </label>
                    <input type="checkbox" id="agree" name="agree" required>
                    
                    
                </div>
                
                <button type="submit">Надіслати</button>
                <button type="reset">Очистити</button>

                
                
                
                
                
                
                
                
                
                
                
                
                
                
                
                
                
                
                
            </form>
            </section>
</body>
</html>
