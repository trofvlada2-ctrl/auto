<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="register" method="post">
      <div>
        <label for="nick">Ваш нікнейм</label>
        <input
          type="text"
          id="nick"
          name="nickname"
          required
          maxlength="3"
          maxlength="20"
        />
      </div>

      <div>
        <label for="email">Ваша пошта</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div>
        <label for="tel">Телефон</label>
        <input type="tel" id="tel" name="tel" pattern="^\+380\d{9}$" />
      </div>

      <div>
        <label for="pass">Пароль</label>
        <input type="password" id="pass" name="pass" required minlength="8" />
      </div>

      <div>
        <label for="age">Вік(16-99) років</label>
        <input type="number" id="age" name="age" required min="16" max="99" />
      </div>

      <div>
        <label for="terms">Я погоджуюся з умовами використання</label>
        <input type="checkbox" id="terms" name="terms" required />
      </div>
      <button type="submit">Зареєструватись</button>
    </form>
  </body>
</html>
