<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cекція курси</title>

    <link rel="stylesheet" href="style5.css" />
  </head>
  <body>
    <section id="courses">
      <div class="conteiner">
        <h2 class="title">Наші курси</h2>

        <div class="grid">
          <article class="card">
            <img src="images.jpeg" alt="Курс" class="card-img" />
            <div class="card-content">
              <h3 class="card-title">JavaScript></h3>
              <p class="card-desc">Базовий курс для початківців</p>
              <div class="card-footer">
                <span class="price">2500</span>
                <button>button type="button" class="btn">Купити</button>
              </div>
            </div>
          </article>

          <article class="card">
            <img
              src="https://picsum.photos/300/160?random=2"
              alt="Курс JS"
              class="card-img"
            />
            <div class="card-content">
              <h3 class="card-title">JavaScript</h3>
              <p class="card-desc">Основи мови та робота з інтерактивністю.</p>
              <div class="card-footer">
                <span class="price">2500 ₴</span>
                <button type="button" class="btn">Купити</button>
              </div>
            </div>
          </article>

          <article class="card">
            <img
              src="https://picsum.photos/300/160?random=3"
              alt="Курс Git"
              class="card-img"
            />
            <div class="card-content">
              <h3 class="card-title">Git & GitHub</h3>
              <p class="card-desc">Контроль версій та публікація проєктів.</p>
              <div class="card-footer">
                <span class="price">900 ₴</span>
                <button type="button" class="btn">Купити</button>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </body>
</html>
