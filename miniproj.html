<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Салоний запис</title>
</head>
<body>
    <section id="contact">
<h2>Форма запису в наш салон</h2>

<form action="form" method="post">
    <div>

        <input type="text" id="name" name="name" required minlength="2" maxlength="20">
        <label for="name">Як Вас звати?</label>
    </div>
 <div>

        <input type="number" id="age" name="age" min="18" max="100">
        <label for="age">Скільки вам років?</label>
    </div>

 <div>

        <input type="tel" id="tel" name="tel" required autocomplete="tel" placeholder="+380XXXXXXXXX" pattern="^\+380\d{9}$">
        <label for="tel">Ваш номер телефону?</label>
    </div>

<div>

    <label for="choose procedure">Обрати процедуру</label>
    <select id="choose procedure" name="procedure">
        <optgroup label="Я обираю процедуру">
            
            <option value="manicure">Манікюр</option>
                <option value="pedicure">Педикюр</option>
                <option value="hair">Волосся</option>
                <option value="brows">Брови</option>
            </optgroup>
        </select>
    </div>

<fieldset>
<legend>Мій майстер</legend>

<div>
<input type="radio" id="master1" name="master" checked value="Olena">
<label for="master1">Олена(топ)</label>



</div>

<div>
<input type="radio" id="maste2" name="master" value="Vitalina">
<label for="master2">Віталіна(стаж 1 рік)</label>



</div>


div>
<input type="radio" id="master3" name="master" value="Maria">
<label for="master3">Марія(майстер-початківець)</label>



</div>



</fieldset>



<fieldset>
                    <br>
                    
                    <legend>Зручний час для дзвінка</legend>
                    <div>
                        <input type="checkbox" id="morning" name="time" value="morning">
                        <label for="morning">Ранок (09:00 - 12:00)</label>
                    </div>
                    
                    <div>

                        
                        <input type="checkbox" id="afternoon" name="time" value="afternoon">
                        <label for="afternoon">День (12:00 - 18:00)</label>
                    </div>
                    
                    
                </fieldset>


                <div>
                    <br>

<label for="message">Напишіть нам</label>
<textarea id="message"  name="message" rows="4"></textarea>


                </div>

<br>

                <div>
                    <label for="agree">Я згоден з  <a href="#" > політикою використання</a> </label>
                    <input type="checkbox" id="agree" name="agree" required>
                    
                    
                </div>
                <br>
                <button type="submit">Записатись</button>
                <button type="reset">Очистити мій  запис</button>



</form>


    </section>
</body>
</html>
